<style>
:root { --y: #0f5c4c; --y2: #a8491f; --fon: #f3f5f4; --kart: #ffffff; --mt: #1b2320; --boz: #66726d; --xett: #dbe2de; --qr: #b3261e; --sari: #8a5a00; }
@media (prefers-color-scheme: dark) { :root { --y: #2a947d; --y2: #cf7647; --fon: #111514; --kart: #1b211f; --mt: #e7edea; --boz: #98a49f; --xett: #2b3430; --qr: #ef8c84; --sari: #e0b860; } }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; }
body { font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--fon); color: var(--mt); display: flex; flex-direction: column; -webkit-text-size-adjust: 100%; overscroll-behavior: none; }
header { padding: calc(env(safe-area-inset-top) + 10px) 16px 9px; background: var(--y); color: #fff; }
header b { font-size: 18px; } #durum { font-size: 12.5px; opacity: .9; margin-top: 1px; }
main { flex: 1; overflow: auto; padding: 12px 16px 20px; -webkit-overflow-scrolling: touch; }
nav { display: flex; background: var(--kart); border-top: 1px solid var(--xett); padding-bottom: env(safe-area-inset-bottom); }
nav button { flex: 1; min-height: 52px; border: 0; background: none; color: var(--boz); font-size: 13.5px; position: relative; }
nav button.sec { color: var(--y); font-weight: 650; box-shadow: inset 0 3px 0 var(--y); }
nav i { font-style: normal; background: var(--y2); color: #fff; border-radius: 9px; font-size: 11px; padding: 0 6px; margin-left: 4px; }
.v { display: none; } .v.sec { display: block; }
h3 { margin: 18px 0 8px; font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--boz); }
.b { min-height: 46px; padding: 0 14px; border: 1px solid var(--xett); border-radius: 11px; background: var(--kart); color: var(--mt); font: inherit; display: inline-flex; align-items: center; justify-content: center; text-decoration: none; text-align: center; cursor: pointer; }
.b.esas { background: var(--y); border-color: var(--y); color: #fff; font-weight: 600; } .b.esas2 { background: var(--y2); border-color: var(--y2); color: #fff; font-weight: 600; }
.b.tehluke { color: var(--qr); } .b:disabled { opacity: .5; }
.lnk { border: 0; background: none; color: var(--y); font: inherit; padding: 6px 0; text-decoration: underline; cursor: pointer; }
input, select, textarea { font: inherit; font-size: 16px; min-height: 46px; padding: 8px 12px; border: 1px solid var(--xett); border-radius: 11px; background: var(--kart); color: var(--mt); width: 100%; }
label.sahe { display: block; font-size: 13px; color: var(--boz); margin: 10px 0 0; } label.sahe > * { margin-top: 3px; }
.row { display: flex; gap: 8px; margin: 10px 0; } .row > * { flex: 1; min-width: 0; }
#kam { position: relative; background: #000; border-radius: 14px; overflow: hidden; aspect-ratio: 4 / 3; }
#vid { width: 100%; height: 100%; object-fit: cover; display: none; } #kam.aciq #vid { display: block; }
.cerceve { position: absolute; inset: 30% 9%; border: 2px solid rgba(255,255,255,.9); border-radius: 10px; display: none; box-shadow: 0 0 0 999px rgba(0,0,0,.25); } #kam.aciq .cerceve { display: block; }
#kamMesaj { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #cdd6d2; padding: 18px; text-align: center; } #kam.aciq #kamMesaj { display: none; }
.kart { background: var(--kart); border: 1px solid var(--xett); border-radius: 14px; padding: 14px; margin: 10px 0; }
.ad { font-size: 18px; font-weight: 650; overflow-wrap: anywhere; } .alt { color: var(--boz); font-size: 14px; margin-top: 2px; overflow-wrap: anywhere; }
.cem { margin: 12px 0 6px; } .cem b { font-size: 26px; font-variant-numeric: tabular-nums; }
.sr { display: flex; gap: 8px; align-items: baseline; padding: 7px 0; border-top: 1px solid var(--xett); font-size: 15px; } .sr span { flex: 1; min-width: 0; overflow-wrap: anywhere; } .sr b { font-variant-numeric: tabular-nums; } .sr i { font-style: normal; color: var(--sari); font-size: 13px; }
.qeyd { color: var(--boz); font-size: 13px; margin: 8px 0; } .xeta { color: var(--qr); font-size: 14px; margin: 8px 0; }
.siy > button { display: flex; width: 100%; gap: 10px; align-items: center; text-align: left; padding: 10px 2px; border: 0; border-bottom: 1px solid var(--xett); background: none; color: inherit; font: inherit; cursor: pointer; }
.siy > button > span { flex: 1; min-width: 0; } .siy b.q { font-variant-numeric: tabular-nums; white-space: nowrap; } .siy .sif { color: var(--boz); font-weight: 400; }
.pd { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: flex; align-items: flex-end; z-index: 10; } .pd[hidden] { display: none; }
.pdq { background: var(--fon); width: 100%; max-height: 93%; overflow: auto; border-radius: 18px 18px 0 0; padding: 8px 16px calc(env(safe-area-inset-bottom) + 18px); }
.pdx { display: flex; justify-content: flex-end; position: sticky; top: 0; } .pdx button { border: 0; background: var(--kart); color: var(--mt); width: 40px; height: 40px; border-radius: 20px; font-size: 18px; }
.off { display: flex; gap: 12px; align-items: flex-start; margin: 10px 0; } .off img { width: 84px; height: 84px; object-fit: contain; background: #fff; border-radius: 10px; border: 1px solid var(--xett); }
.ai { white-space: pre-wrap; font-size: 15px; background: var(--kart); border: 1px solid var(--xett); border-radius: 11px; padding: 10px 12px; margin: 10px 0; }
#toast { position: fixed; left: 16px; right: 16px; bottom: calc(env(safe-area-inset-bottom) + 70px); background: #1f2925; color: #fff; padding: 12px 14px; border-radius: 12px; z-index: 30; text-align: center; transition: opacity .25s; } #toast[hidden] { display: none; }
.nis { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 9px; background: var(--xett); color: var(--mt); margin-left: 6px; white-space: nowrap; } .nis.med { background: var(--y); color: #fff; } .nis.mex { background: var(--y2); color: #fff; }
.sorgu { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 20; display: flex; align-items: center; justify-content: center; padding: 24px; } .sorgu > div, .sorgu > form { background: var(--kart); border-radius: 16px; padding: 18px; width: 100%; max-width: 420px; white-space: pre-wrap; }
.sr.yeni { background: rgba(42, 148, 125, .16); border-radius: 8px; }
.basliq { display: flex; align-items: baseline; gap: 14px; } .basliq h3 { flex: 1; }
.siy .nis { white-space: normal; max-width: 100%; }
.yoxla .sr b { width: 22px; flex: none; } .yoxla .sr span { flex: none; width: 42%; } .yoxla .sr i { flex: 1; font-style: normal; color: var(--boz); overflow-wrap: anywhere; }                          /* uzun vəziyyət («Təsdiq edildi və icra olundu») dar ekranda sətrə bölünür */
.siy > button.secili { background: rgba(42, 148, 125, .16); } .qutu { font-size: 22px; line-height: 1; color: var(--y); flex: none; }
.mq { width: 40px; height: 40px; border-radius: 20px; border: 1px solid var(--xett); background: var(--kart); color: var(--mt); font-size: 20px; line-height: 1; flex: none; }
.mqs { border: 0; background: none; color: var(--mt); font: inherit; font-weight: 650; font-variant-numeric: tabular-nums; min-width: 62px; text-align: center; flex: none; padding: 8px 2px; }
.qr { color: var(--qr); }
.nis.ok { background: #1f8a4c; color: #fff; } .nis.gz { background: var(--sari); color: #fff; } .nis.qy { background: var(--y2); color: #fff; } .nis.xt { background: var(--qr); color: #fff; }
textarea { min-height: 70px; resize: vertical; }
</style>
</head>
<body>
<header><b>Anbar Mobil</b><div id="durum" role="button" tabindex="0">Yüklənir…</div></header>
<main>
  <section id="v-skan" class="v sec">
    <div id="kam"><video id="vid" playsinline muted></video><div class="cerceve"></div><div id="kamMesaj">Kamera bağlıdır</div></div>
    <div class="row">
      <button id="bKam" class="b esas" type="button">Kameranı aç</button>
      <button id="bIsiq" class="b" type="button" hidden>İşıq</button>
      <label class="b">Şəkildən oxu<input id="fSekil" type="file" accept="image/*" capture="environment" hidden></label>
    </div>
    <form id="fKod" class="row"><input id="iKod" placeholder="Barkod və ya stok kodu" autocomplete="off" enterkeyhint="search" style="flex:3"><button class="b" style="flex:1">Tap</button></form>
    <div id="kassa"></div>
    <div id="skanAlt"></div>
  </section>

</main>

  <button data-v="skan" class="sec" type="button">Skan</button>

<div id="pd" class="pd" hidden><div class="pdq"><div class="pdx"><button id="pdBagla" type="button" aria-label="Bağla">✕</button></div><div id="pdm"></div></div></div>
<div id="toast" hidden></div>
<datalist id="dlTey"></datalist><datalist id="dlKont"></datalist>
<script>
'use strict';
const SURUM = '0.3.3 · 21.11.2026';
const LIB = 'https://cdn.jsdelivr.net/npm/barcode-detector@3.2.3/dist/iife/ponyfill.min.js';
const FORMATLAR = ['ean_13', 'ean_8', 'upc_a', 'upc_e', 'code_128', 'code_39', 'itf', 'qr_code', 'data_matrix'];
const NOV_AD = {MEDAXIL: 'Mədaxil', MEXARIC: 'Məxaric'};
const $ = s => document.querySelector(s);

function el(tag, at, ...ic) {
  const e = document.createElement(tag);
  if (at) for (const k in at) {
    const v = at[k];
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'text') e.textContent = v;
    else if (k.slice(0, 2) === 'on') e.addEventListener(k.slice(2), v);
    else if (k === 'hidden' || k === 'disabled' || k === 'selected' || k === 'value') e[k] = v;
    else e.setAttribute(k, v);
  }
  for (const c of ic.flat(3)) if (c != null && c !== false) e.append(c.nodeType ? c : document.createTextNode(String(c)));
  return e;
}

// ---------------------------------------------------------------- yaddaş (IndexedDB; alınmasa localStorage)
const KV = (() => {
  let p;
  const ac = () => p || (p = new Promise((res, rej) => {
    const r = indexedDB.open('uyum-mobil', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  }));
  return {
    async get(k) {
      try {
        const d = await ac();
        return await new Promise((res, rej) => { const q = d.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); });
      } catch (e) { const v = localStorage.getItem('um:' + k); return v ? JSON.parse(v) : undefined; }
    },
    async set(k, v) {
      try {
        const d = await ac();
        await new Promise((res, rej) => { const t = d.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = () => res(); t.onerror = () => rej(t.error); });
      } catch (e) { try { localStorage.setItem('um:' + k, JSON.stringify(v)); } catch (e2) {} }
    }
  };
})();

// ---------------------------------------------------------------- vəziyyət
const S = {db: null, ix: new Map(), bark: {}, barkE: {}, barkYeni: [], sened: [], kassa: null, sonSetir: '', det: null, detAd: '',
  qos: null, giris: null, srv: [], yenilenir: false, gonderilir: false, sonYenileme: 0,
  ayar: {cihaz: '', ad: '', anbar: '', gkey: '', gmodel: 'gemini-2.5-flash', sayac: 0}};
const saxla = k => KV.set(k, S[k]);

const pad = n => String(n).padStart(2, '0');
function indi() { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`; }
const bugun = () => indi().slice(0, 10);
const tarixAz = t => t ? t.slice(8, 10) + '.' + t.slice(5, 7) + '.' + t.slice(0, 4) : '';
const vaxtQisa = t => t ? t.slice(8, 10) + '.' + t.slice(5, 7) + ' ' + t.slice(11, 16) : '—';
function say(x) { const r = Math.round(x * 1000) / 1000; return String(r).replace('.', ','); }
function ededOxu(s) { const x = parseFloat(String(s).replace(/\s/g, '').replace(',', '.')); return isFinite(x) ? x : NaN; }
function norm(s) { return String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/ə/g, 'e').replace(/ı/g, 'i').replace(/\s+/g, ' ').trim(); }

let toastT;
function toast(m, san) { const t = $('#toast'); t.textContent = m; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, (san || 2.6) * 1000); }
function sorus(metn, beli, xeyr) {
  return new Promise(res => {
    const o = el('div', {class: 'sorgu'}, el('div', null, metn, el('div', {class: 'row'},
      el('button', {class: 'b', type: 'button', text: xeyr || 'Xeyr', onclick: () => { o.remove(); res(false); }}),
      el('button', {class: 'b esas', type: 'button', text: beli || 'Bəli', onclick: () => { o.remove(); res(true); }}))));
    document.body.append(o);
  });
}

// ---------------------------------------------------------------- mərkəz: Neon-un HTTPS yolu (proqramın qoşulması) + istifadəçinin girişi (token)
const QOS = 'qos=';
const ROL = {admin: 'administrator', anbardar: 'anbardar', baxis: 'baxış'};
class ApiXeta extends Error { constructor(kod, m) { super(m); this.kod = kod; } }
async function api(fn, ...args) {
  const q = S.qos;
  if (!q) throw new ApiXeta('QOS', 'Telefon mərkəzə qoşulmayıb (Ayarlar).');
  const url = (/^(localhost|127\.0\.0\.1)(:|$)/.test(q.h) ? 'http://' : 'https://') + q.h + '/sql';
  const cs = `postgresql://${encodeURIComponent(q.u)}:${encodeURIComponent(q.p)}@${q.h.split(':')[0]}/${encodeURIComponent(q.d)}?sslmode=require`;
  const sorgu = {query: `SELECT anbar.${fn}(${args.map((_, i) => '$' + (i + 1)).join(',')}) AS r`,
    params: args.map(a => a == null ? null : typeof a === 'object' ? JSON.stringify(a) : String(a))};
  let r, j;
  try {
    r = await fetch(url, {method: 'POST', body: JSON.stringify(sorgu),
      headers: {'Content-Type': 'application/json', 'Neon-Connection-String': cs, 'Neon-Raw-Text-Output': 'true', 'Neon-Array-Mode': 'true'}});
  } catch (e) { throw new ApiXeta('OFFLINE', `Mərkəzə qoşulmaq olmadı — internet yoxdur və ya şəbəkə mərkəzi bağlayır (${(e && e.message) || e}).`); }
  try { j = await r.json(); } catch (e) { j = {}; }
  if (!r.ok && api.yoxlama) throw new ApiXeta(j.hint || 'HTTP' + r.status, j.message || `Mərkəz cavab vermədi (${r.status})`);   // yoxlama: hesabdan çıxarmır
  if (!r.ok) {
    if (j.hint === 'AUTH' && S.giris) { S.giris = null; saxla('giris'); durumYaz(); }
    throw new ApiXeta(j.hint || 'HTTP' + r.status, j.message || `Mərkəz cavab vermədi (${r.status})`);
  }
  const row = j.rows && j.rows[0], raw = Array.isArray(row) ? row[0] : row && row.r;
  const v = raw == null ? null : typeof raw === 'string' ? JSON.parse(raw) : raw;
  if (v && typeof v === 'object' && !Array.isArray(v) && v.error && v.message) throw new ApiXeta(v.error, v.message);
  return v;
}
const tok = () => S.giris && S.giris.tok;
async function baglantiYoxla(yer) {                                       // «Bağlantını yoxla»: problem harada — şəkli çəkilib adminə göndərilə bilər
  const l = [], ua = navigator.userAgent;
  const cihaz = (/iPhone|iPad/.test(ua) ? 'iPhone/iPad, iOS ' + ((ua.match(/OS (\d+[_\d]*)/) || [])[1] || '?').replace(/_/g, '.') :
    /Android/.test(ua) ? 'Android ' + ((ua.match(/Android ([\d.]+)/) || [])[1] || '?') : 'kompüter') +
    ' · ' + (/CriOS|Chrome/.test(ua) ? 'Chrome ' + ((ua.match(/(?:Chrome|CriOS)\/(\d+)/) || [])[1] || '') : /Safari/.test(ua) ? 'Safari' : /Firefox|FxiOS/.test(ua) ? 'Firefox' : 'brauzer') +
    (navigator.standalone || matchMedia('(display-mode: standalone)').matches ? ' · ana ekrandan' : ' · brauzerdə');
  l.push(['ℹ', 'Proqram', 'Anbar Mobil ' + SURUM], ['ℹ', 'Telefon', cihaz]);
  yer.replaceChildren(el('div', {class: 'qeyd', text: 'Yoxlanır…'}));
  let net = false, saatFerq = 0;
  try { const r = await fetch('./manifest.webmanifest?y=' + Date.now(), {cache: 'no-store'}); net = r.ok; const d = Date.parse(r.headers.get('Date') || ''); if (d) saatFerq = Math.round((Date.now() - d) / 60000); } catch (e) {}
  l.push([net ? '✔' : '✘', 'İnternet', net ? 'var' : 'yoxdur']);
  const saatSehv = Math.abs(saatFerq) > 10;
  if (net) l.push([saatSehv ? '✘' : '✔', 'Telefonun saatı', saatSehv ? `${Math.abs(saatFerq)} dəqiqə ${saatFerq > 0 ? 'irəlidir' : 'geridir'}` : 'düzdür']);
  l.push([S.qos ? '✔' : '✘', 'Mərkəzə qoşulma (QR)', S.qos ? 'var · ' + S.qos.n : 'yoxdur']);
  let merkez = null;
  if (S.qos && net) {
    const t0 = Date.now();
    api.yoxlama = true;
    try { await api('api_me', 'x'.repeat(64)); merkez = 'cavab verir'; }
    catch (e) { merkez = e.kod === 'AUTH' ? `cavab verir (${Date.now() - t0} ms)` : null; if (!merkez) l.push(['✘', 'Mərkəz', e.message]); }
    finally { api.yoxlama = false; }
    if (merkez) l.push(['✔', 'Mərkəz', merkez]);
  }
  let sade = null, neon = null, kenar = null;
  if (S.qos && net && !merkez) {
    const cat = async u => { const ac = new AbortController(), t = setTimeout(() => ac.abort(), 8000);                 // 8 san-dan çox gözləmir
      try { await fetch(u, {mode: 'no-cors', cache: 'no-store', signal: ac.signal}); return true; } catch (e) { return false; } finally { clearTimeout(t); } };
    [sade, neon, kenar] = await Promise.all([cat('https://' + S.qos.h + '/sql?y=' + Date.now()), cat('https://neon.tech/favicon.ico?y=' + Date.now()), cat('https://www.google.com/favicon.ico?y=' + Date.now())]);
    l.push([sade ? '✔' : '✘', 'Mərkəzin ünvanı (sadə yoxlama)', sade ? 'çatır' : 'çatmır'], [neon ? '✔' : '✘', 'neon.tech saytı', neon ? 'açılır' : 'açılmır'],
      [kenar ? '✔' : '✘', 'Başqa sayt (google.com)', kenar ? 'açılır' : 'açılmır']);
  }
  l.push([S.giris ? '✔' : '•', 'Giriş', S.giris ? S.giris.me.login + ' (' + (ROL[S.giris.me.role] || S.giris.me.role) + ')' : 'daxil olunmayıb']);
  const meslehet = !net ? 'İnternet yoxdur — Wi-Fi və ya mobil interneti yoxlayın.'
    : !S.qos ? 'Telefon hələ mərkəzə qoşulmayıb. Kompüterdəki proqramda Hesab → «📱 Telefonu qoş» → buradakı «QR kodu skan et» ilə oxudun. Uzaqdasınızsa: admin həmin pəncərədə «Kodu kopyala» basıb sizə WhatsApp ilə göndərsin — linkə toxunun.'
    : !merkez && saatSehv ? 'Telefonun tarixi/saatı səhvdir — buna görə təhlükəsiz bağlantı qurulmur. Telefonun Ayarlar → Tarix və saat → «Avtomatik» seçin, sonra yenidən yoxlayın.'
    : !merkez && kenar === false ? 'Telefon kənar saytlara çıxa bilmir (bu şəbəkə məhduddur). Mobil internetə və ya başqa Wi-Fi-a keçib yenidən yoxlayın.'

      el('div', {class: 'row'}, el('button', {class: 'b esas', type: 'button', text: 'İndi yenilə', onclick: () => yenile()}), el('button', {class: 'b', type: 'button', text: 'Hesabdan çıx', onclick: cixis})),
      el('div', {class: 'qeyd', text: 'Məlumat proqram açılanda və hər 3 dəqiqədən bir özü yenilənir. İnternet olmayanda da işləyir: yazdıqlarınız internet gələndə göndərilir.'}));
  const anb = el('select', null, el('option', {value: '', text: '— hər dəfə seçilsin —'}), yazAnbar().map(x => el('option', {value: x, text: x, selected: x === a.anbar})));
  anb.addEventListener('change', () => { a.anbar = anb.value; saxla('ayar'); });
  const gk = el('input', {type: 'password', value: a.gkey, placeholder: 'Gemini API açarı', autocomplete: 'off'});
  gk.addEventListener('change', () => { a.gkey = gk.value.trim(); saxla('ayar'); });
  const gm = el('input', {value: a.gmodel, placeholder: 'gemini-2.5-flash', autocomplete: 'off', autocapitalize: 'off'});
  gm.addEventListener('change', () => { a.gmodel = gm.value.trim(); saxla('ayar'); });
  const gq = el('div', {class: 'qeyd'}), sq = el('div', {class: 'qeyd', text: S.detAd ? 'Oxuyucu: ' + S.detAd : ''});
  const yoxYer = el('div');
  v.replaceChildren(
    el('h3', {text: 'Mərkəz'}), merkez,
    el('div', {class: 'row'}, el('button', {class: 'b', type: 'button', text: 'Bağlantını yoxla', onclick: () => baglantiYoxla(yoxYer)})), yoxYer,
    ...(g ? [el('h3', {text: 'Əsas anbar'}),
      el('div', {class: 'kart'}, el('label', {class: 'sahe'}, 'Sənəd yazanda susmaya görə', anb), el('div', {class: 'qeyd', text: 'Cihaz kodu: ' + a.cihaz}))] : []),

        catch (e) { gq.textContent = 'Alınmadı: ' + (e.message || e); } }})), gq,

function gorunus(ad) {
  document.querySelectorAll('.v').forEach(x => x.classList.toggle('sec', x.id === 'v-' + ad));
  document.querySelectorAll('nav button').forEach(x => x.classList.toggle('sec', x.dataset.v === ad));
  if (ad !== 'skan' && K.aktiv) kamBagla();
  if (ad === 'axtar') { axtarCiz(); setTimeout(() => $('#iAxtar').focus(), 50); }
  if (ad === 'jurnal') { jurnalCiz(); if (S.giris && Date.now() - S.sonYenileme > 20000) yenile(true); }
  if (ad === 'ayar') ayarCiz();
}
function ciz() {
  durumYaz(); nisan(); kassaCiz();
  $('#skanAlt').hidden = !!S.kassa;
  $('#skanAlt').replaceChildren(S.db ? el('div', {class: 'qeyd', text: 'Barkodu çərçivəyə gətirin. Barkodsuz mal üçün «Axtar» bölməsindən adına görə tapın.'})
    : el('div', {class: 'kart'}, el('div', {class: 'ad', text: !S.qos ? 'Telefonu mərkəzə qoşun' : !S.giris ? 'Daxil olun' : 'Mal siyahısı yüklənir…'}),

          : !S.giris ? 'Proqramın istifadəçi adı və parolu ilə.' : 'Mal siyahısı, qalıqlar və barkodlar mərkəzdən gəlir.'}),
        el('div', {class: 'row'}, !S.qos ? el('button', {class: 'b esas', type: 'button', text: 'QR kodu skan et', onclick: () => { if (!K.aktiv) kamAc(); }})
          : !S.giris ? el('button', {class: 'b esas', type: 'button', text: 'Daxil ol', onclick: () => girisForm()})
          : el('button', {class: 'b', type: 'button', text: 'Yenilə', onclick: () => yenile()}))));
  const sec = document.querySelector('.v.sec').id.slice(2);
  if (sec === 'axtar') axtarCiz(); if (sec === 'jurnal') jurnalCiz(); if (sec === 'ayar') ayarCiz();
}

document.querySelectorAll('nav button').forEach(b => b.addEventListener('click', () => gorunus(b.dataset.v)));

$('#fSekil').addEventListener('change', e => { const f = e.target.files[0]; if (f) sekildenOxu(f); e.target.value = ''; });
$('#fKod').addEventListener('submit', e => { e.preventDefault(); const b = $('#iKod').value.trim(); if (b) { $('#iKod').value = ''; $('#iKod').blur(); kodAc(b); } });
$('#iAxtar').addEventListener('input', axtarCiz);
document.addEventListener('visibilitychange', () => {
  if (document.hidden && K.aktiv) kamBagla();
  if (!document.hidden && Date.now() - S.sonYenileme > 60000) yenile(true);
});
window.addEventListener('online', () => { durumYaz(); yenile(true); }); window.addEventListener('offline', durumYaz);
$('#durum').addEventListener('click', () => S.giris ? yenile() : gorunus('ayar'));
window.addEventListener('hashchange', () => {                             // proqram açıq ikən qoşulma linkinə toxunulub (WhatsApp və s.)
  const q = qosOxu(location.hash);
  if (q) { history.replaceState(null, '', location.pathname + location.search); qosQebul(q); }
});
setInterval(() => { if (!document.hidden && navigator.onLine !== false) yenile(true); }, 180000);
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
(async () => {
  try { await yukle(); } catch (e) { toast('Yaddaş oxunmadı: ' + (e.message || e), 5); }
  const q = qosOxu(location.hash);                                        // proqramın QR kodu telefonun öz kamerası ilə açılıbsa
  if (q) history.replaceState(null, '', location.pathname + location.search);
  ciz();
  if (q) await qosQebul(q); else if (S.giris) yenile(true);
  if (navigator.onLine !== false) setTimeout(() => skanerYoxla().catch(() => {}), 1500);       // kitabxana oflayn üçün əvvəlcədən keşlənsin
})();
